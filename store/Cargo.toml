[package]
name = "store"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
# rocksdb 0.16 pulls librocksdb-sys 6.20/bindgen 0.59, whose parser crashes
# on the RocksDB headers shipped with Ubuntu 24.04. The Store API used by this
# project is unchanged in 0.22.
rocksdb = "0.22.0"
tokio = { version = "1.5.0", features = ["sync", "macros", "rt"] }
